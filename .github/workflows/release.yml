# Publishes the standalone engine: a launcher, a prebuilt workerd runtime and the built engine.
# Someone downloads one tarball, unpacks it, runs ./bin/kitesurf, and any CDP client can drive it
# over 127.0.0.1 — no Node, no wrangler, no Cloudflare account.
#
# The engine dist is architecture independent, so the expensive Bazel build happens once and each
# platform tarball only swaps in a workerd binary for that platform. Every platform is assembled
# and smoke tested on a runner of its own architecture, so linux-64 is verified on linux-64
# rather than cross-packed.
name: Release engine

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build: all, or a comma-separated subset such as linux-64"
        type: string
        default: all

permissions:
  contents: read

env:
  # Must match the @cloudflare/workerd-* version pinned in pnpm-lock.yaml. The dist is built and
  # tested against that runtime's compatibility date and flags, and a mismatch changes behaviour
  # silently. The launcher also needs workerd's `--experimental` for the workerLoader binding.
  WORKERD_VERSION: "1.20260911.1"

jobs:
  # Build the engine dist once, plus the third-party inventory every tarball ships.
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write # lets the setup action authenticate the job to bazelflare when it can
    steps:
      - uses: actions/checkout@v4
      - id: setup
        uses: ./.github/actions/setup
        with:
          bazel-cache: "true"
          # Deliberately not bazelflare: that is Cloudflare's remote executor, and the setup
          # action turns it on for any job that has an OIDC token, so a fork or a private runner
          # would try to reach it and fail instead of building here. Builds locally, using the
          # restored Bazel caches.
          bazelflare: "false"
          rust: "true"
      - run: pnpm install --frozen-lockfile
      # This build deliberately skips `--config=devtools`: staging Chrome's frontend costs a
      # 250 MB download and a CDP client does not need it. The engine serves its landing page
      # either way, and Chrome can use its own hosted copy against a local engine.
      - name: Build the Wasm core and the loaded-worker bundles
        run: pnpm run build
      # `wrangler deploy --dry-run` bundles the Worker the way a deploy would and records the
      # options (compatibility date and flags, vars, worker loader, assets directory) that the
      # launcher turns into the workerd config shipped in the tarball.
      - name: Bundle the deployable dist
        run: |
          node scripts/wpt-engine.mjs prepare --dist "$RUNNER_TEMP/engine-dist"
          find "$RUNNER_TEMP/engine-dist" -maxdepth 1 -name '*.map' -delete
      - uses: actions/upload-artifact@v4
        with:
          name: engine-dist
          path: ${{ runner.temp }}/engine-dist
          if-no-files-found: error

      # Attribution. The Wasm core is most of the released code, and cargo-about needs the
      # patched vendor trees materialized before it can walk the workspace.
      - name: Materialize the patched vendor trees
        run: pnpm run vendor:apply
      - name: Install the Rust inventory collector
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Collect the Rust inventory for the Wasm core
        run: |
          cargo about generate --locked --config .config/about.toml \
            --manifest-path Cargo.toml \
            --output-file "$RUNNER_TEMP/rust-notices.md" scripts/rust-notices.hbs
      - name: Assemble THIRD_PARTY_NOTICES.md
        run: |
          curl -fsSL -o "$RUNNER_TEMP/WORKERD-LICENSE" \
            "https://raw.githubusercontent.com/cloudflare/workerd/v$WORKERD_VERSION/LICENSE"
          node scripts/engine-release/notices.mjs \
            --out "$RUNNER_TEMP/THIRD_PARTY_NOTICES.md" \
            --rust-notices "$RUNNER_TEMP/rust-notices.md" \
            --workerd-notice "$RUNNER_TEMP/WORKERD-LICENSE" \
            --require-rust
      - uses: actions/upload-artifact@v4
        with:
          name: engine-notices
          path: ${{ runner.temp }}/THIRD_PARTY_NOTICES.md
          if-no-files-found: error
      # The setup action above only restores the Bazel caches; the job saves them, as ci.yml does.
      # A release tag is not a branch, but its caches still warm later runs through restore-keys.
      # Saving is best effort: a quota or size failure must not fail an otherwise good release.
      - if: >-
          !cancelled() && steps.setup.outputs.bazel-cache-key != ''
          && steps.setup.outputs.bazel-cache-hit != 'true'
          && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.setup.outputs.bazel-cache-paths }}
          key: ${{ steps.setup.outputs.bazel-cache-key }}

  # One tarball per platform. Nothing compiles here: download workerd, stage the assets, generate
  # the config, start it, check /health and a built-in font, pack, checksum.
  runtime:
    needs: bundle
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # workerd publishes darwin-64 as well, so Intel Macs are covered. The macOS runners are
          # Apple silicon and Rosetta is not guaranteed there, so darwin-64 packs without a local
          # smoke run. Drop that row if Intel Macs are not wanted.
          - platform: linux-64
            runner: ubuntu-latest
            skip_smoke: "0"
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            skip_smoke: "0"
          - platform: darwin-arm64
            runner: macos-14
            skip_smoke: "0"
          - platform: darwin-64
            runner: macos-14
            skip_smoke: "1"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: engine-dist
          path: ${{ runner.temp }}/engine-dist
      - uses: actions/download-artifact@v4
        with:
          name: engine-notices
          path: ${{ runner.temp }}/notices
      # The assembly script is the same one a contributor runs locally; see its header. A dispatch
      # may select a subset of platforms; a tag push leaves the input empty and builds all of them.
      - name: Assemble, smoke test and pack
        if: ${{ !github.event.inputs.platforms || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.platform) }}
        env:
          SKIP_SMOKE: ${{ matrix.skip_smoke }}
          NOTICES_FILE: ${{ runner.temp }}/notices/THIRD_PARTY_NOTICES.md
          TARBALL_DIR: ${{ runner.temp }}/tar
        run: |
          set -eu
          OUT="$RUNNER_TEMP/pkg"
          # Reuse the artifact instead of rebuilding: pre-place the dist the script looks for.
          mkdir -p "$OUT/runtime"
          cp -R "$RUNNER_TEMP/engine-dist" "$OUT/runtime/dist"
          SKIP_BUILD=1 sh scripts/engine-release/assemble-runtime.sh "$OUT" "${{ matrix.platform }}"
          mkdir -p dist
          NAME="kitesurf-engine-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          cp "$RUNNER_TEMP/tar/kitesurf-engine-${{ matrix.platform }}.tar.gz" "dist/$NAME.tar.gz"
          cp "$RUNNER_TEMP/tar/kitesurf-engine-${{ matrix.platform }}.tar.gz.sha256" \
            "dist/$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        if: ${{ !github.event.inputs.platforms || github.event.inputs.platforms == 'all' || contains(github.event.inputs.platforms, matrix.platform) }}
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Artifacts are enough for a dispatch, so this only publishes on a tag.
  release:
    needs: runtime
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tarball-*
          merge-multiple: true
          path: dist
      # A draft, so a test run publishes nothing until it is reviewed.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
